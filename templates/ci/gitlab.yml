stages:
  - verify

variables:
  OPDEV_VERSION: {{VERSION_JSON}}

opdev:
  stage: verify
  image: {{IMAGE_JSON}}
  # Never inherit compiled caches from a different libc/toolchain environment.
  cache: []
  before_script:
    - set -eu
    - 'for command in git curl tar sha256sum mktemp getconf; do command -v "$command" >/dev/null || { echo "OpDev CI requires $command in the selected image" >&2; exit 1; }; done'
    - 'test "$(uname -m)" = x86_64 || { echo "This generated OpDev job requires x86_64; select a reviewed native installer for this runner" >&2; exit 1; }'
    - 'libc=$(getconf GNU_LIBC_VERSION); version=${libc#glibc }; major=${version%%.*}; minor=${version#*.}; minor=${minor%%.*}; test "$major" -gt 2 || { test "$major" -eq 2 && test "$minor" -ge 39; } || { echo "OpDev requires glibc >= 2.39; preserve product images and select a compatible isolated verification job" >&2; exit 1; }'
    - base="{{RELEASE_BASE}}"
    - archive="opdev-${OPDEV_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
    - install_dir="$(mktemp -d)"
    - curl --fail --silent --show-error --location --output "$install_dir/$archive" "$base/$archive"
    - curl --fail --silent --show-error --location --output "$install_dir/SHA256SUMS" "$base/SHA256SUMS"
    - curl --fail --silent --show-error --location --output "$install_dir/cosign" "https://github.com/sigstore/cosign/releases/download/{{COSIGN_VERSION}}/cosign-linux-amd64"
    - 'echo "{{COSIGN_DIGEST}}  $install_dir/cosign" | sha256sum -c -'
    - chmod 700 "$install_dir/cosign"
    - curl --fail --silent --show-error --location --output "$install_dir/$archive.sigstore.json" "$base/$archive.sigstore.json"
    - '"$install_dir/cosign" verify-blob "$install_dir/$archive" --bundle "$install_dir/$archive.sigstore.json" --certificate-identity "{{SIGNING_IDENTITY}}" --certificate-oidc-issuer https://gitlab.com'
    - (cd "$install_dir" && grep "  $archive$" SHA256SUMS | sha256sum -c -)
    - 'test "$(tar -tzf "$install_dir/$archive" | grep -cx opdev)" -eq 1'
    - 'tar -tvzf "$install_dir/$archive" opdev | awk ''substr($0,1,1) != "-" {exit 1}'''
    - tar -xOzf "$install_dir/$archive" opdev > "$install_dir/opdev"
    - chmod 700 "$install_dir/opdev"
    - export PATH="$install_dir:$PATH"
    - opdev version
  script:
    - |
      set -e
      report_file="$(mktemp)"
      set +e
      opdev check --ci --format json > "$report_file"
      opdev_status=$?
      cp "$report_file" opdev-report.json
      copy_status=$?
      if [ "$copy_status" -ne 0 ]; then
        echo "Could not preserve the OpDev report" >&2
        exit "$copy_status"
      fi
      exit "$opdev_status"
  artifacts:
    when: always
    paths:
      - opdev-report.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
