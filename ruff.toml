required-version = "==0.16.10"
target-version = "py310"
line-length = 100
# Frozen evaluation inputs are specimens, not maintained executable tooling.
extend-exclude = ["benchmarks"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# These tests disable bytecode output before importing their test modules.
"tests/*.py" = ["E402"]
