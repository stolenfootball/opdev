schema: 2
project:
- rule_id: MCD-CONFIG-001
  outcome: passed
  summary: >-
    Behavior-controlling schemas, manifests, rules, templates, and toolchain
    versions are versioned and tested.
  evidence:
  - kind: repository
    summary: >-
      Strict project, report, profile, extension, evidence, and release schemas are
      checked into version control.
    location: schema
  - kind: test
    summary: >-
      Workspace tests parse schemas, manifests, profiles, CI templates, agent files,
      and protocol messages.
    location: crates
- rule_id: MCD-ARTIFACT-002
  outcome: passed
  summary: >-
    Native binaries are built once, compared byte-for-byte after additive
    cargo-dist packaging, and promoted through the sole protected GitLab publisher to
    immutable GitHub releases.
  evidence:
  - kind: ci
    summary: >-
      The native handoff preserves its repeat packaging check. prepare_dist.py
      compares every repackaged executable with its input, and publish_github.py requires
      exact tag and asset digests. Six-target fixture generation and the release-evidence
      inventory test cover the migrated path. Candidate pipeline 2835650463 published
      the same qualified bytes; all 43 downloaded assets matched GitHub digests.
    location: .gitlab-ci.yml
  - kind: release
    summary: >-
      The release manifest and provenance bind RC2 artifact digests to source
      revision 103e1cd614fcbb171189bf48affd099170d0efab and its builder run.
    location: >-
      https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/releases/v0.1.0-rc.2
- rule_id: MCD-RECOVERY-001
  outcome: passed
  summary: >-
    OpDev uses immutable stateless releases and safe roll-forward; the GitHub
    publisher additionally resumes matching drafts without replacing existing bytes.
  evidence:
  - kind: policy
    summary: >-
      The on-demand recovery procedure preserves evidence, restores trunk, requires
      regression protection, and republishes only through the canonical pipeline.
    location: release/README.md
  - kind: test
    summary: >-
      Offline publication tests exercise an interrupted draft upload, resume,
      immutable publication retry, mismatched assets, wrong tags, missing signatures, and
      disabled immutability. The historical GitLab roll-forward remains documented. Live
      immutable candidate publication retry job 16411303523 passed without rebuilding or
      replacing assets; no live interrupted upload was injected.
    location: >-
      https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/merge_requests/3
- rule_id: MCD-CONFIG-002
  outcome: passed
  summary: >-
    Runtime location is externalized through OPDEV_DATA_DIR while release versions,
    verification identities, and platform pins remain versioned and tested; CI
    credentials remain injected.
  evidence:
  - kind: architecture
    summary: >-
      The managed-runtime contract separates caller-selected storage from versioned
      release and trust inputs.
    location: spec/installation.md
  - kind: test
    summary: >-
      POSIX and PowerShell fixtures install into overridden temporary paths with
      spaces without changing global PATH or project state.
    location: tests
  - kind: ci
    summary: >-
      Publication credentials and exact release identity enter only at the protected
      GitLab pipeline boundary.
    location: .gitlab-ci.yml
- rule_id: OPDEV-TEST-007
  outcome: passed
  summary: >-
    External release qualification declares its native runner environments, GitHub
    and GitLab dependencies, per-tag freshness, visible variability, and blocking
    effect on publication.
  evidence:
  - kind: ci
    summary: >-
      The build handoff is bound to an exact source revision and workflow run,
      retries are not hidden, and any unavailable or failing target blocks the protected tag
      pipeline.
    location: .github/workflows/release-build.yml
  - kind: policy
    summary: >-
      Release qualification requires a fresh candidate run and representative
      consumer installation before a final tag.
    location: release/README.md
- rule_id: OPDEV-SUPPLY-001
  outcome: passed
  summary: >-
    Every released archive has machine-readable provenance and a keyless signature
    binding its digest to the exact source and GitLab release identity.
  evidence:
  - kind: release
    summary: >-
      RC2 includes an in-toto provenance statement, a release manifest, SHA-256
      digests, and Sigstore bundles for all seven archives.
    location: >-
      https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/releases/v0.1.0-rc.2
  - kind: specification
    summary: Provenance scope and non-claims are explicitly defined.
    location: spec/release-evidence.md
- rule_id: OPDEV-SUPPLY-002
  outcome: passed
  summary: >-
    Released Rust components are inventoried in a CycloneDX 1.5 SBOM whose digest
    is bound into the release manifest and provenance.
  evidence:
  - kind: release
    summary: >-
      RC2 publishes the generated CycloneDX document alongside the artifacts and its
      checksummed release evidence.
    location: >-
      https://gitlab.com/stolenfootball-tools/opinionateddevelopment/-/releases/v0.1.0-rc.2
  - kind: specification
    summary: >-
      The all-target dependency inventory scope and its limitations are documented
      without overstating artifact-level completeness.
    location: spec/release-evidence.md
- rule_id: OPDEV-SEC-001
  outcome: passed
  summary: >-
    The project documents its attack surface and applies proportional controls at
    each untrusted boundary.
  evidence:
  - kind: policy
    summary: >-
      Reporting, repository trust, command execution, remote audit, extension, and
      release-evidence boundaries are documented.
    location: docs/SECURITY.md
  - kind: test
    summary: >-
      Safe command execution, output bounds, process-tree timeouts, strict protocols,
      and remote host restrictions have automated tests.
    location: crates
- rule_id: OPDEV-SEC-002
  outcome: passed
  summary: >-
    Untrusted change CI is separated from tag-only publication credentials and uses
    least-privilege permissions.
  evidence:
  - kind: ci
    summary: >-
      GitLab merge-request verification does not use publication tokens; package
      upload and OIDC signing are tag-only jobs.
    location: .gitlab-ci.yml
  - kind: ci
    summary: >-
      GitHub change CI declares read-only contents permission and uses full-SHA
      pinned actions.
    location: .github/workflows/opdev.yml
