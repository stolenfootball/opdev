schema: 3
layout:
  version: 2
  review_reference: "https://gitlab.com/stolenfootball-tools/opdev/-/issues/101#note_3989549727"
project:
  kind: plugin
  trunk: main
  ci:
    provider: gitlab
    remote: git@gitlab.com:stolenfootball-tools/opdev.git
    qualification:
      review_reference: https://gitlab.com/stolenfootball-tools/opdev/-/issues/101
      source: push
      required_jobs:
      - quality
      - plugin-validation
      - installer-linux
      - installer-arm64
      - installer-windows
      - qualify-dist
      - qualify-dist-windows
      required_checks: []
      protection:
        kind: gitlab
        rules:
        - name: main
          push:
          - kind: role
            id: 0
          merge:
          - kind: role
            id: 40
authorities:
  architecture:
    kind: path
    location: spec
  contracts:
    kind: path
    location: spec
  contributing:
    kind: path
    location: docs/CONTRIBUTING.md
  delivery:
    kind: path
    location: release
  documentation:
    kind: path
    location: docs
  implementation:
    kind: path
    location: crates
  security:
    kind: path
    location: docs/SECURITY.md
  testing:
    kind: path
    location: spec
  work:
    kind: tracker
    location: https://gitlab.com/stolenfootball-tools/opdev/-/issues
commands:
  check:
    argv:
    - cargo
    - test
    - --workspace
    - --all-features
    timeout_seconds: 1800
  format:
    argv:
    - cargo
    - fmt
    - --all
    - --
    - --check
    timeout_seconds: 300
  lint:
    argv:
    - cargo
    - clippy
    - --workspace
    - --all-targets
    - --all-features
    - --
    - -D
    - warnings
    timeout_seconds: 900
  package:
    argv:
    - cargo
    - build
    - --release
    - --locked
    timeout_seconds: 1800
  script_format:
    argv:
    - python
    - scripts/check_scripts.py
    - format
    timeout_seconds: 900
  script_lint:
    argv:
    - python
    - scripts/check_scripts.py
    - lint
    timeout_seconds: 900
  setup:
    argv:
    - cargo
    - fetch
    - --locked
    timeout_seconds: 900
quality:
  risks:
  - functional
  - reliability
  - security
  - compatibility
  - maintainability
  - recoverability
testing:
  strategy_authority: testing
  change_tests: required
  escaped_defect_regressions: required_or_justified
  flake_policy:
    retries_visible: true
    quarantine_requires_owner_issue_expiry: true
  coverage:
    mode: report
  suites:
  - id: script_format
    command: script_format
    stages:
    - local
    - pre_merge
    - post_merge
  - id: script_lint
    command: script_lint
    stages:
    - local
    - pre_merge
    - post_merge
  - id: format
    command: format
    stages:
    - local
    - pre_merge
    - post_merge
  - id: lint
    command: lint
    stages:
    - local
    - pre_merge
    - post_merge
  - id: check
    command: check
    stages:
    - local
    - pre_merge
    - post_merge
delivery:
  status: configured
  mode: release
  artifact:
    kind: native-cli-and-agent-plugin
    locator: https://github.com/stolenfootball/opdev/releases
  environments:
  - name: windows-x86_64
    production_like: true
  - name: windows-aarch64
    production_like: true
  - name: linux-x86_64
    production_like: true
  - name: linux-aarch64
    production_like: true
  - name: macos-x86_64
    production_like: true
  - name: macos-aarch64
    production_like: true
  - name: codex-plugin-validator
    production_like: true
  - name: claude-code-plugin-validator
    production_like: true
  recovery:
    strategy: roll_forward
assurance:
  requirements:
    version: 1
    review_reference: "https://gitlab.com/stolenfootball-tools/opdev/-/issues/101#note_3989549727"
    configurations:
      default:
      - local
      - pre_merge
      - post_merge
  review_storage:
    version: 2
    provider: gitlab
    repository_id: 85892266
    review_reference: https://gitlab.com/stolenfootball-tools/opdev/-/issues/101
    retention_authority: contributing
    report_retention_days: 30
  safeguards:
    version: 1
    review_reference: https://gitlab.com/stolenfootball-tools/opdev/-/issues/101
    capabilities:
      persistent_data:
        state: present
        rationale: >-
          Project/adoption contracts, local continuation and migration recovery state
          survive invocations; compatibility and interrupted writes need checks.
        authority: contracts
      public_contract:
        state: present
        rationale: >-
          CLI arguments, exit codes, JSON schemas, extension protocols and generated
          agent guidance have external consumers.
        authority: contracts
      distribution:
        state: present
        rationale: >-
          Native binaries and Codex/Claude plugins have signed installation and update
          paths.
        authority: delivery
      security_boundary:
        state: present
        rationale: >-
          Untrusted repository input, process execution, provider authentication and
          signed downloads cross trust boundaries.
        authority: contracts
      operations:
        state: present
        rationale: >-
          On-demand checks, timeouts, diagnostics, interrupted writes and installation
          recovery have operational behavior.
        authority: contracts
      user_interface:
        state: present
        rationale: >-
          Human CLI output and agent decision prompts follow spec/consumer-interface.md,
          not a universal accessibility certification.
        authority: contracts
      effectiveness:
        state: present
        rationale: >-
          Agent guidance is intended to improve real development outcomes; bounded
          workflow trials measure utility separately from Rust correctness.
        authority: contracts
  engineering:
    version: "1"
    minimumcd: "1"
    review_reference: https://gitlab.com/stolenfootball-tools/opdev/-/issues/101
  profiles:
  - name: nist-ssdf-derived
    version: "1.1"
    level: baseline
context:
  always:
  - contracts
  routes:
    architecture_change:
    - architecture
    - contracts
    code_change:
    - implementation
    - testing
    - contracts
    delivery_change:
    - delivery
    - contracts
    documentation_change:
    - documentation
    - contracts
    effectiveness_evaluation:
    - contracts
    experimental_change:
    - contracts
    - testing
    - delivery
    - work
    security_change:
    - security
    - contracts
