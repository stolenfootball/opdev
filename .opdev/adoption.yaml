clean_target:
  version: 3
  inventory_reference: "https://gitlab.com/stolenfootball-tools/opdev/-/issues/112#note_3992028424"
  retirements:
  - path: .opdev/evidence.yaml
    reason: >-
      Replaced by bounded current-change MR review under storage 2; no archive
      required.
    replacement: null
  - path: .github/workflows/opdev.yml
    reason: >-
      Obsolete duplicate mirror gate reads the retired ledger; GitLab owns source
      qualification.
    replacement: .gitlab-ci.yml
schema: 2
catalog_version: 2
scope: >-
  Rust workspace; Python test/evaluation/release helpers; POSIX and PowerShell
  installers; versioned schemas and agent guidance; Codex/Claude plugins; GitLab CI
  and GitHub native-build/publication handoff. Clean-3 self-adoption with preserved
  supported behavior.
practices:
  accessibility:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Preserve approved noninteractive/readable-text/explicit-consent targets; verify
      changed output. No universal WCAG or host-interface certification.
    references:
    - spec/consumer-interface.md
    - crates/opdev-cli/tests/consumer_interface.rs
    suites:
    - check
    research: []
  agents:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Shared current-policy guidance and thin regular-file host pointers are present.
      Self-development uses the verified source CLI; installed runtimes and pins
      remain unchanged. Routing and bounded Codex trials retain their stated limits.
    references:
    - .opdev/guidance.md
    - AGENTS.md
    - CLAUDE.md
    suites:
    - check
    research: []
  coding_style:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Preserve rustfmt/Clippy; maintained supporting scripts use Ruff, shfmt,
      ShellCheck and PSScriptAnalyzer with versioned high-signal rules. Frozen benchmark
      inputs are excluded, not rewritten to satisfy style checks.
    references:
    - Cargo.toml
    - docs/CONTRIBUTING.md
    suites:
    - format
    - lint
    - script_format
    - script_lint
    - check
    research: []
  configuration:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Reviewed schema 4, engineering 2, layout 3 and clean-3 retain tools,
      capabilities, requirements and storage ownership. MinimumCD is a separate assessment; no
      organization pack is selected. Secrets and runtime locations remain external.
    references:
    - schema
    - plugins/opdev/runtime.lock
    - docs/SECURITY.md
    suites:
    - check
    research: []
  coverage:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Advisory Rust coverage with no percentage gate; instrument the same canonical
      Linux execution. Other languages/native targets and agent effectiveness are
      outside measurement.
    references:
    - .gitlab-ci.yml
    - docs/CONTRIBUTING.md
    suites:
    - check
    research:
    - https://github.com/taiki-e/cargo-llvm-cov/tree/v0.9.1
  delivery:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Preserve six native targets, signed immutable assets and the protected GitLab
      publisher. Current dependency-path and publication-conflict regressions verify
      controls; supported artifact observations identify their exact published version. No
      historical result qualifies new source or authorizes publication.
    references:
    - .gitlab-ci.yml
    - .github/workflows/release-build.yml
    - release/README.md
    - crates/opdev-cli/tests/delivery_recovery.rs
    suites:
    - check
    research: []
  dependencies:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Preserve locked Rust and pinned CI tools; review changed dependencies/security
      risks. SBOM and signatures do not establish absence of vulnerabilities.
    references:
    - Cargo.lock
    - docs/SECURITY.md
    - spec/release-evidence.md
    - scripts/style-tools.json
    suites:
    - check
    research: []
  effectiveness:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Twelve approved paired advice-only Codex sessions compared actual policy 1 and
      2. No unsafe qualification observed; no efficiency gain established. This is not
      full coding-session, live Claude or human-comprehension evidence.
    references:
    - benchmarks/workflow-usability/README.md
    - benchmarks/adoption/README.md
    - spec/workflow-usability.md
    - "https://gitlab.com/stolenfootball-tools/opdev/-/issues/112#note_3992444280"
    suites:
    - check
    research: []
  experiments:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Compact views remain explicit experimental opt-in; adoption neither activates
      nor promotes them. Keep existing accountable experiment/evaluation work.
    references:
    - spec/experiments.md
    - spec/token-efficiency.md
    - benchmarks/sessions/compact-experiment.yaml
    - https://gitlab.com/stolenfootball-tools/opdev/-/issues/28
    suites:
    - check
    research: []
  extensions:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Retain additive checks and NIST-derived informative profile. Engineering
      mandatory; MinimumCD assessment separate. Extensions cannot waive required rules.
    references:
    - spec/assurance-profiles.md
    suites:
    - check
    research: []
  formatting:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Rust uses rustfmt, Python Ruff, POSIX shell shfmt and PowerShell
      PSScriptAnalyzer formatting. Canonical checks cover maintained sources; frozen benchmarks
      retain their original input bytes.
    references:
    - docs/CONTRIBUTING.md
    - scripts
    - tests
    suites:
    - format
    - script_format
    - check
    research: []
  integration:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Main remains sole trunk/release source with direct pushes disabled. Exact
      pre/post-merge review selection, seven required jobs and provider protection were
      exercised and observed; this increment repeats affected current checks.
    references:
    - .gitlab-ci.yml
    - crates/opdev-remote/src/ci_review.rs
    - https://gitlab.com/stolenfootball-tools/opdev/-/issues/101
    suites:
    - check
    research: []
  linting:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Deny-warnings Clippy/compiler checks, Ruff high-signal Python rules, ShellCheck
      and PSScriptAnalyzer enforce reviewed component conventions. Linux qualification
      does not substitute for the required Windows checks.
    references:
    - Cargo.toml
    - scripts
    - tests
    suites:
    - lint
    - script_lint
    - check
    research: []
  observability:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Preserve actionable text/JSON, stderr/exit status, bounds and interrupted-write
      diagnostics. Hosted telemetry is not required for the on-demand CLI.
    references:
    - spec/consumer-interface.md
    - crates/opdev-cli/tests/consumer_interface.rs
    suites:
    - check
    research: []
  project:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Preserve existing scope and authority ownership; GitLab issue owns adoption
      work, not repository backlog.
    references:
    - .opdev/project.yaml
    - spec/README.md
    suites: []
    research: []
  recovery:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Interrupted migration resumes reviewed states while retaining later product
      writes; installer failure preserves verified versions; publication resumes matching
      assets and rejects conflicts. Zero loss is the tested bounded target, not a
      universal SLA. Forward-patch remediation and MinimumCD rollback remain separate
      claims. Existing snapshots are temporary, not an evidence archive.
    references:
    - release/README.md
    - tests/runtime_test.py
    - tests/runtime_test.ps1
    - tests/dist_test.py
    - crates/opdev-cli/src/migration/tests.rs
    - crates/opdev-cli/tests/delivery_recovery.rs
    suites:
    - check
    research: []
  review:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Use exact MR review and independent selection, current source/stage binding and
      actual assertion/content review; attribution is not human consent.
    references:
    - docs/CONTRIBUTING.md
    - spec/evidence-ledger.md
    - crates/opdev-remote/src/discussion_review.rs
    suites:
    - check
    research: []
  security:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Preserve fail-closed input/process/authentication/signature boundaries and
      negative tests. CI uses built-in short-lived job identity; no dedicated token
      provisioning or personal credential in MR jobs.
    references:
    - docs/SECURITY.md
    - spec/remote-audits.md
    - crates/opdev-remote/src/ci_review.rs
    suites:
    - check
    research: []
  setup:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Use Rust 1.97.0, Cargo.lock, Python 3 and versioned CI inputs; verify clean CI
      including pinned coverage tooling.
    references:
    - rust-toolchain.toml
    - Cargo.lock
    - .gitlab-ci.yml
    - scripts/setup_style.py
    - scripts/style-tools.json
    suites:
    - check
    research: []
  testing:
    state: implemented
    owner: Jeremy (maintainer); Codex implementation and evidence review
    reason: >-
      Keep meaningful acceptance/regression assertions, visible retries and
      owner/issue/expiry quarantine. Verify pre/post-merge and native coverage.
    references:
    - docs/CONTRIBUTING.md
    - crates/opdev-cli/tests/ci_routing.rs
    - crates/opdev-cli/tests/layout.rs
    suites:
    - check
    research: []
