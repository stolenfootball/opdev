image: python:3.13-bookworm
default:
  tags: [linux, docker, proxmox]
cache:
  key: shared-python-environment
  paths: [.venv/]
stages: [test, package]
test:
  stage: test
  script: [python -m unittest discover -s tests]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
package:
  stage: package
  script: [tar -czf parcelnote.tar.gz parcelnote]
  artifacts:
    paths: [parcelnote.tar.gz]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
