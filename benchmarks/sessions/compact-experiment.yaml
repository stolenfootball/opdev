schema: 1
id: compact-context
work: https://gitlab.com/stolenfootball-tools/opdev/-/issues/28
owner: stolenfootball
review_by: 2026-10-15
purpose: Test whether compact views reduce session token use without reducing accepted delivery quality.
decision:
  promote: A preregistered balanced session comparison with the corrected oracle establishes quality-equivalent savings; issue 28 records thresholds before evaluation.
  abandon: Quality regresses or full-diagnostic fallback erases worthwhile savings in the agreed evaluation.
isolation:
  mechanism: runtime_flag
  details: Each compact command requires --experimental-compact; agents require explicit user or project opt-in. The same artifact ships both configurations.
  stable_default: Full human or JSON check output and the full ledger; no persistent or automatic activation.
  recovery: Omit the flag and use full output and the original ledger; projections do not mutate evidence or data formats.
configurations:
  - id: stable
    exposure: stable
    description: No flag; compact requests fail before I/O, full report persistence remains available.
    suites: [check]
  - id: compact
    exposure: experimental
    description: Explicit flag enables read-only projections with complete authoritative evidence retained.
    suites: [check]
cleanup: On promotion deliberately adopt a supported option or remove the temporary switch; on abandonment remove compact command surfaces and agent routes. Preserve historical benchmark evidence and stable report formats.
