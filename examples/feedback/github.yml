name: Feedback fixture
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 examples/feedback/fixture.py verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification
          path: feedback-artifacts/verification.json
  # Require this check in protection; always() alone does not reject skipped work.
  integration:
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - shell: python
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          import os
          import sys
          result = os.environ.get("VERIFY_RESULT", "missing")
          if result != "success":
              print(f"Required verification did not succeed: {result}. Merging is not verified.")
              sys.exit(1)
          print("Required verification succeeded for this example run.")
  candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verification
          path: feedback-artifacts
      - run: python3 examples/feedback/fixture.py candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate
          path: feedback-artifacts/
  consume:
    needs: candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate
          path: feedback-artifacts
      - run: python3 examples/feedback/fixture.py consume
